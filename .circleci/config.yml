version: 2.1

# ShopApp CI — builds and tests the whole app on every push.
#
# This is the baseline the "CI Needs API Discipline" section of the article
# series argues about: right now every job below runs against the *whole*
# app, because nothing yet computes which modules a given change actually
# touches. `graph-tool check` (tools/GraphTool) is wired in here for the
# first time — ADR-0001 named it as written but "not yet wired into CI".
# Diff-based selective testing (only run the modules a change could affect)
# is a deliberate next step, not part of this baseline.

parameters:
  xcode_version:
    default: "27.0.0"
    type: string
  iphone_device:
    default: "iPhone 17"
    type: string
  iphone_os:
    default: "27.0"
    type: string
  global_resource_class:
    default: "m4pro.medium"
    type: string

jobs:
  check-dependency-graph:
    macos:
      xcode: <<pipeline.parameters.xcode_version>>
    resource_class: <<pipeline.parameters.global_resource_class>>
    steps:
      - checkout
      - run:
          name: run graph-tool dependencies check 
          command: |
            swift run --package-path tools/GraphTool graph-tool check --package-path .

  build-and-test:
    macos:
      xcode: <<pipeline.parameters.xcode_version>>
    resource_class: <<pipeline.parameters.global_resource_class>>
    steps:
      - checkout

      - run:
          name: Trust macro plugins (no interactive prompt on a fresh CI image)
          command: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - run:
          name: Install XcodeGen and xcbeautify
          command: brew install xcodegen xcbeautify

      - run:
          name: Generate ShopApp.xcodeproj from project.yml
          command: xcodegen generate

      - restore_cache:
          keys:
            - spm-deps-v1-{{ checksum "Package.resolved" }}

      - run:
          name: Resolve Swift Package dependencies
          command: |
            set -o pipefail
            xcodebuild -resolvePackageDependencies \
              -project ShopApp.xcodeproj \
              -scheme ShopApp | xcbeautify

      - save_cache:
          key: spm-deps-v1-{{ checksum "Package.resolved" }}
          paths:
            - ~/Library/Developer/Xcode/DerivedData

      - run:
          name: List available simulators (diagnostic — adjust the destination below if this image's default device differs)
          command: xcrun simctl list devices available

      - run:
          name: Build ShopApp
          command: |
            set -o pipefail
            xcodebuild build \
              -scheme ShopApp \
              -destination 'platform=iOS Simulator,name=<<pipeline.parameters.iphone_device>>,OS=<<pipeline.parameters.iphone_os>>' \
              -resultBundlePath build-results/build.xcresult | xcbeautify

      - run:
          name: Run ShopAppTests + ShopAppUITests
          command: |
            set -o pipefail
            xcodebuild test \
              -scheme ShopApp \
              -destination 'platform=iOS Simulator,name=<<pipeline.parameters.iphone_device>>,OS=<<pipeline.parameters.iphone_os>>' \
              -resultBundlePath build-results/test.xcresult | xcbeautify

      # Runs even when the test step above failed — that's the whole point:
      # a failing snapshot test attaches reference/failure/difference PNGs to
      # the xcresult, and those are exactly what's needed to tell "wrong
      # render" from "environment drift" without re-running anything.
      #
      # No --only-failures here: xcresulttool's own manifest shows
      # swift-snapshot-testing's reference/failure/difference PNGs are all
      # flagged isAssociatedWithFailure=false (only the plain-text issue
      # description is true), so that flag silently drops every image and
      # keeps only the text. Passing tests attach nothing, so exporting
      # without the filter still only ever produces files for tests that
      # actually failed.
      - run:
          name: Export snapshot diff images from the test result bundle
          when: always
          command: |
            xcrun xcresulttool export attachments \
              --path build-results/test.xcresult \
              --output-path build-results/snapshot-diffs

            # Exported files land with opaque UUID names; manifest.json maps
            # each one back to a suggested human-readable name and the test
            # it belongs to. Restore that so the artifact is browsable.
            python3 scripts/organize-snapshot-diffs.py build-results/snapshot-diffs

      # .xcresult bundles are directories (often 1000+ internal files) —
      # CircleCI's artifact browser lists every one individually rather than
      # offering a single download. Zip each bundle so it's one file that
      # unzips back into something Xcode's Report Navigator can open.
      - run:
          name: Archive xcresult bundles for download
          when: always
          command: |
            mkdir -p build-results/archive
            cd build-results
            for bundle in *.xcresult; do
              [ -e "$bundle" ] || continue
              zip -rq "archive/${bundle}.zip" "$bundle"
            done

      - store_artifacts:
          path: build-results/archive
          destination: xcresults

      - store_artifacts:
          path: build-results/snapshot-diffs
          destination: snapshot-diffs

workflows:
  build-test:
    jobs:
      - check-dependency-graph
      - build-and-test
