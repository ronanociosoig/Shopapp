name: ShopApp
options:
  bundleIdPrefix: com.shopapp.demo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

schemes:
  ShopApp:
    build:
      targets:
        ShopApp: all
        ShopAppTests: [test]
        ShopAppUITests: [test]
    run:
      config: Debug
      targets: [ShopApp]
    test:
      config: Debug
      targets:
        - ShopAppTests
        - ShopAppUITests
    profile:
      config: Release
  SearchApp:
    build:
      targets:
        SearchApp: all
    run:
      config: Debug
      targets: [SearchApp]
    profile:
      config: Release
  CheckoutApp:
    build:
      targets:
        CheckoutApp: all
        CheckoutAppUITests: [test]
    run:
      config: Debug
      targets: [CheckoutApp]
    test:
      config: Debug
      targets:
        - CheckoutAppUITests
    profile:
      config: Release
  AccountApp:
    build:
      targets:
        AccountApp: all
    run:
      config: Debug
      targets: [AccountApp]
    profile:
      config: Release
  SupportApp:
    build:
      targets:
        SupportApp: all
    run:
      config: Debug
      targets: [SupportApp]
    profile:
      config: Release
  SuggestionsApp:
    build:
      targets:
        SuggestionsApp: all
    run:
      config: Debug
      targets: [SuggestionsApp]
    profile:
      config: Release
  PromotionsApp:
    build:
      targets:
        PromotionsApp: all
    run:
      config: Debug
      targets: [PromotionsApp]
    profile:
      config: Release
  PastPurchasesApp:
    build:
      targets:
        PastPurchasesApp: all
    run:
      config: Debug
      targets: [PastPurchasesApp]
    profile:
      config: Release
  DesignSystemApp:
    build:
      targets:
        DesignSystemApp: all
    run:
      config: Debug
      targets: [DesignSystemApp]
    profile:
      config: Release

# Reference the local Swift package — all module products become available
# as dependencies for the app targets below.
packages:
  ShopApp:
    path: "."
  swift-snapshot-testing:
    url: "https://github.com/pointfreeco/swift-snapshot-testing"
    from: "1.17.0"

# MARK: - App targets

targets:

  # ── Main App (composition root) ──────────────────────────────────────────────
  #
  # The only target that depends on all feature modules.
  # Responsible for creating repositories and injecting them into feature models.

  ShopApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shop/App/Sources
    dependencies:
      - package: ShopApp
        product: ShopCore
      - package: ShopApp
        product: Store
      - package: ShopApp
        product: Search
      - package: ShopApp
        product: Checkout
      - package: ShopApp
        product: Account
      - package: ShopApp
        product: Promotions
      - package: ShopApp
        product: PastPurchases
      - package: ShopApp
        product: Suggestions
      # Testing: modules without a production backend use stubs at runtime.
      # These dependencies are explicit so the intent is visible at a glance.
      - package: ShopApp
        product: StoreTesting
      - package: ShopApp
        product: AccountTesting
      - package: ShopApp
        product: CheckoutTesting
      - package: ShopApp
        product: PromotionsTesting
      - package: ShopApp
        product: SuggestionsTesting
      - package: ShopApp
        product: SearchTesting
      - package: ShopApp
        product: PastPurchasesTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopapp.demo.app
        PRODUCT_NAME: ShopApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    info:
      path: Shop/App/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  ShopAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shop/Tests/Sources
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: ShopApp
      - package: swift-snapshot-testing
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopapp.demo.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ShopApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ShopApp
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

  ShopAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shop/App/UITests
    dependencies:
      - target: ShopApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopapp.demo.app.uitests
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        GENERATE_INFOPLIST_FILE: YES

  # ── Search ──────────────────────────────────────────────────────────────────

  SearchApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Features/Search/App/Sources
